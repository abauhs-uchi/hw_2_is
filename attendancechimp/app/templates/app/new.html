<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        form { max-width: 400px; margin: 0 auto; }
        .field { margin: 12px 0; }
    </style>
</head>
<body>
    <h1>Sign Up</h1>

    <form action="/app/createUser" method="post">
        {% csrf_token %}

        <div class="field">
            <label for="user_name">Username:</label>
            <input type="text" id="user_name" name="user_name" required>
        </div>

        <div class="field">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="field">
            <label><input type="radio" name="is_student" value="1" checked> Student</label>
            <label><input type="radio" name="is_student" value="0"> Instructor</label>
        </div>

        <button type="submit">Sign Up</button>
    </form>
</body>
</html>
